spring.application.name=eeveevoiding-responsibilities-campus-events
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/campus-events}
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

rabbitmq.exchange.events=events.exchange
rabbitmq.routing-key.event-change=event.change

# Notification service (para EVENT_REMINDER)
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}

jwt.secret=test-secret-key-for-testing-only-32chars!!
