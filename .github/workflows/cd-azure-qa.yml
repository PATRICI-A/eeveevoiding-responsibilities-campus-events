name: CD - Deploy to QA

on:
  workflow_run:
    workflows: ["CI - Build & Unit Tests"]
    branches:
      - main
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: patrici-a/eeveevoiding-responsibilities-campus-events
  RESOURCE_GROUP: rg-patricia-prod

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to QA Container App
        run: |
          az containerapp update \
            --name patricia-campus-events-qa \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest

      - name: Health check QA
        run: |
          sleep 30

          QA_URL=$(az containerapp show \
            --name patricia-campus-events-qa \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "QA URL: https://$QA_URL"

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$QA_URL/actuator/health)

            echo "Attempt $i — HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              exit 0
            fi

            sleep 15
          done

          echo "Health check failed"
          exit 1