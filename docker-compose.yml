services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: ${MONGO_CONTAINER_NAME:-campus-events-mongo}
    ports:
      - "${MONGO_PORT_HOST:-27017}:${MONGO_PORT_CONTAINER:-27017}"
    volumes:
      - ${MONGO_VOLUME_NAME:-mongo-data}:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ${APP_CONTAINER_NAME:-campus-events-app}
    ports:
      - "${APP_PORT_HOST:-8080}:${APP_PORT_CONTAINER:-8080}"
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/campus-events}
      SERVER_PORT: ${APP_PORT_CONTAINER:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mongodb
volumes:
  mongo-data:
    name: ${MONGO_VOLUME_NAME:-mongo-data}
